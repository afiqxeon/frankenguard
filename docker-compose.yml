services:
  localstack:
    image: localstack/localstack:latest
    container_name: frankenguard-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=iam,s3,cloudtrail
      - DEFAULT_REGION=us-east-1
    volumes:
      - "./demo-fixtures:/fixtures"

  frankenguard-engine:
    build: .
    container_name: frankenguard-engine
    stdin_open: true
    tty: false
    volumes:
      - "./demo-fixtures:/app/demo-fixtures"
    depends_on:
      - localstack
