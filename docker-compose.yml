services:
  frankenguard-engine:
    build: .
    container_name: frankenguard-engine
    command: ["socat", "TCP-LISTEN:4444,reuseaddr,fork", "EXEC:'node dist/mcp-server/src/index.js'"]
    ports:
      - "127.0.0.1:4444:4444"
    volumes:
      - "./demo-fixtures:/app/demo-fixtures"

  frankenguard-ui:
    build: .
    container_name: frankenguard-ui
    command: ["npm", "run", "ui:start"]
    ports:
      - "3000:3000"
    volumes:
      - "./demo-fixtures:/app/demo-fixtures"
